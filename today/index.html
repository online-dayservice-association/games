<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>今日は何の日？｜あそび・脳トレ素材集</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Zen+Old+Mincho:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/tokens.css">

<style>
*{box-sizing:border-box;}
html,body{margin:0;}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);line-height:1.9;-webkit-font-smoothing:antialiased;}
.wrap{max-width:860px;margin:0 auto;padding:0 20px;}
.backlink{display:inline-block;margin:20px 0 0;color:var(--accent-deep);text-decoration:none;font-size:15px;border-bottom:1px solid var(--line);}
.backlink:hover{border-color:var(--accent);}
a:focus-visible,button:focus-visible{outline:3px solid var(--accent);outline-offset:3px;border-radius:8px;}

header{text-align:center;padding:40px 0 8px;}
.eyebrow{font-size:13px;letter-spacing:.18em;color:var(--accent-deep);font-weight:500;margin-bottom:14px;}
.today-date{font-family:var(--font-head);font-weight:700;font-size:clamp(34px,6vw,52px);letter-spacing:.04em;margin:0;}
.today-sub{margin-top:10px;color:var(--muted);font-size:clamp(16px,2.6vw,19px);}

.block-label{display:flex;align-items:center;gap:14px;margin:52px 0 18px;}
.block-label .num{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:50%;background:var(--accent);color:#fff;font-weight:700;font-size:16px;flex:none;}
.block-label .label{font-family:var(--font-head);font-weight:700;font-size:20px;white-space:nowrap;letter-spacing:.04em;}
.block-label .line{flex:1;height:1px;background:var(--line);}

.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px 26px;margin-bottom:14px;box-shadow:0 6px 18px rgba(86,96,73,.07);}
.anniv .a-title{font-family:var(--font-head);font-weight:700;font-size:23px;margin:0 0 8px;color:var(--accent-deep);}
.anniv .a-desc{font-size:17px;line-height:1.85;margin:0;}

.cap{font-size:14px;font-weight:700;letter-spacing:.06em;color:var(--accent-deep);margin:0 0 12px;}
.quiz .q-text{font-family:var(--font-head);font-weight:700;font-size:20px;margin:0 0 16px;}
.choices{display:flex;flex-direction:column;gap:10px;}
.choice{font-family:var(--font-body);font-size:18px;text-align:left;padding:14px 18px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);cursor:pointer;transition:border-color .15s, background .15s;}
.choice:hover:not(:disabled){border-color:var(--accent);}
.choice:disabled{cursor:default;}
.choice.correct{background:#e7efdc;border-color:var(--accent);color:var(--accent-deep);font-weight:700;}
.choice.wrong{background:#f4e2dd;border-color:#caa99f;color:#8a5a4a;}
.explain{margin-top:14px;padding:14px 16px;background:var(--bg);border-left:3px solid var(--accent);border-radius:0 10px 10px 0;font-size:16px;display:none;}
.explain.show{display:block;}

.qbox ul{list-style:none;margin:0;padding:0;}
.qbox li{font-size:18px;padding:8px 0;}
.qbox li+li{border-top:1px dashed var(--line);}

/* 下端ナビ（前日・きょう・翌日／一覧・トップ） */
.daynav{margin:46px 0 0;}
.daynav-row{display:flex;justify-content:center;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px;}
.navbtn{
  display:inline-flex;align-items:center;justify-content:center;gap:.4em;
  padding:14px 22px;border-radius:999px;
  background:var(--card);border:1px solid var(--accent);color:var(--accent-deep);
  font-family:var(--font-body);font-weight:700;font-size:17px;text-decoration:none;
  transition:background .15s ease,color .15s ease,transform .12s ease;
}
.navbtn:hover{background:var(--accent);color:#fff;transform:translateY(-2px);}
.navbtn.primary{background:var(--accent);color:#fff;box-shadow:var(--shadow);}
.navbtn.primary:hover{background:var(--accent-deep);}
.navbtn.sub{border-color:var(--line);color:var(--muted);font-weight:500;font-size:15px;padding:11px 20px;}
.navbtn.sub:hover{background:var(--bg);color:var(--accent-deep);border-color:var(--accent);transform:none;}
@media (max-width:560px){
  .daynav-row{gap:8px;}
  .navbtn{font-size:15px;padding:12px 16px;}
}

footer{margin:52px 0 60px;padding-top:24px;border-top:1px solid var(--line);text-align:center;color:var(--muted);font-size:14px;}
footer a{color:var(--accent-deep);text-decoration:none;border-bottom:1px solid var(--line);}
</style>
</head>
<body>
<div class="wrap">
  <a class="backlink" href="../">← 素材集にもどる</a>
  <a class="backlink" href="./list.html" id="listLinkTop" style="margin-left:14px;">日付からえらぶ</a>

  <header>
    <div class="eyebrow">あそび・脳トレ素材集</div>
    <h1 class="today-date" id="dateLabel">　</h1>
    <p class="today-sub">今日は何の日？</p>
  </header>

  <main id="main"><p style="text-align:center;color:var(--muted);padding:40px 0;">読み込み中…</p></main>

  <nav class="daynav" aria-label="日付の移動">
    <div class="daynav-row">
      <a class="navbtn" id="prevBtn" href="#">←</a>
      <a class="navbtn primary" id="todayBtn" href="./" style="display:none;">きょうの日へ</a>
      <a class="navbtn" id="nextBtn" href="#">→</a>
    </div>
    <div class="daynav-row">
      <a class="navbtn sub" id="listLinkBottom" href="./list.html">日付一覧にもどる</a>
      <a class="navbtn sub" href="../">素材集トップへ</a>
    </div>
  </nav>

  <div class="to-menu" style="text-align:center;margin:38px 0 -6px;"><a href="../" style="display:inline-block;font-family:var(--font-body);font-weight:700;font-size:17px;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:999px;padding:13px 40px;text-decoration:none;box-shadow:var(--shadow);">← 素材集にもどる</a></div>
<footer>一般社団法人オンラインデイサービス協会<br><a href="https://www.onlinedayservice.com">www.onlinedayservice.com</a><br><span style="display:inline-block;margin-top:10px;">この素材集は、オンラインデイサービスの現場で使われています。<br>サービスを利用してみたい方は <a href="https://www.onlinedayservice.com/#operators">導入事業者のご紹介</a> へ</span></footer>
</div>

<script>
const main=document.getElementById('main');
const dateLabel=document.getElementById('dateLabel');
const ORD=['ひとつめ','ふたつめ','みっつめ','よっつめ'];
const d=new Date();
const todayKey=String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
// ?date=MM-DD があればその日を表示。なければ今日。
const key=(new URLSearchParams(location.search).get('date'))||todayKey;

/* ---------- 日付ナビ（前日・きょう・翌日／一覧） ---------- */
(function(){
  const LEN=[31,29,31,30,31,30,31,31,30,31,30,31]; // 2/29を含む366日でひと回り
  const order=[];
  for(let m=1;m<=12;m++)for(let i=1;i<=LEN[m-1];i++)order.push(String(m).padStart(2,'0')+'-'+String(i).padStart(2,'0'));
  const idx=order.indexOf(key);
  const fmt=k=>parseInt(k.slice(0,2),10)+'月'+parseInt(k.slice(3),10)+'日';
  if(idx>=0){
    const prev=order[(idx+order.length-1)%order.length];
    const next=order[(idx+1)%order.length];
    const pb=document.getElementById('prevBtn'), nb=document.getElementById('nextBtn');
    pb.href='./?date='+prev; pb.textContent='← '+fmt(prev);
    nb.href='./?date='+next; nb.textContent=fmt(next)+' →';
  }
  // きょうを見ていないときだけ「きょうの日へ」を出す
  if(key!==todayKey) document.getElementById('todayBtn').style.display='';
  // 一覧リンクには「見ている月」を引き継ぐ
  const m=parseInt(key.slice(0,2),10);
  document.getElementById('listLinkTop').href='./list.html?m='+m;
  document.getElementById('listLinkBottom').href='./list.html?m='+m;
})();

fetch('./data.json?t='+Date.now()).then(r=>r.json()).then(data=>{
  const day=data[key];
  dateLabel.textContent=(day&&day.date_label)||((d.getMonth()+1)+'月'+d.getDate()+'日');
  if(!day){ main.innerHTML='<p style="text-align:center;color:var(--muted);padding:40px 0;">本日のぶんは準備中です。</p>'; return; }
  let html='';
  day.topics.forEach((t,ti)=>{
    html+='<div class="block-label"><span class="num">'+(ti+1)+'</span><span class="label">'+(ORD[ti]||('その'+(ti+1)))+'</span><span class="line"></span></div>';
    html+='<div class="card anniv"><p class="a-title">'+esc(t.title)+'</p><p class="a-desc">'+esc(t.desc)+'</p></div>';
    const q=t.quiz;
    const order=q.choices.map((_,i)=>i);
    for(let i=order.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));const tmp=order[i];order[i]=order[j];order[j]=tmp;}
    t._correctPos=order.indexOf(q.answer);
    let ch='';
    order.forEach((oi,pos)=>{ ch+='<button class="choice" data-t="'+ti+'" data-pos="'+pos+'">'+(pos+1)+'. '+esc(q.choices[oi])+'</button>'; });
    html+='<div class="card quiz"><p class="cap">クイズ</p><p class="q-text">'+esc(q.q)+'</p><div class="choices">'+ch+'</div><div class="explain" id="ex'+ti+'"></div></div>';
    html+='<div class="card qbox"><p class="cap">お話のきっかけ</p><ul>'+t.questions.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul></div>';
  });
  main.innerHTML=html;
  day.topics.forEach((t,ti)=>{
    const q=t.quiz;
    const btns=main.querySelectorAll('.choice[data-t="'+ti+'"]');
    btns.forEach(b=>{ b.onclick=()=>{
      btns.forEach(x=>{ x.disabled=true; if(+x.dataset.pos===t._correctPos)x.classList.add('correct'); });
      if(+b.dataset.pos!==t._correctPos)b.classList.add('wrong');
      const ex=document.getElementById('ex'+ti);
      ex.textContent='正解は '+(t._correctPos+1)+'.　'+q.explain;
      ex.classList.add('show');
    }; });
  });
});

function esc(s){return String(s).replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));}
</script>
</body>
</html>
