<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>今日は何の日？｜あそび・脳トレ素材集</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Zen+Old+Mincho:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/tokens.css">

<style>
*{box-sizing:border-box;}
html,body{margin:0;}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);line-height:1.9;-webkit-font-smoothing:antialiased;}
.wrap{max-width:860px;margin:0 auto;padding:0 20px;}
.backlink{display:inline-block;margin:20px 0 0;color:var(--accent-deep);text-decoration:none;font-size:15px;border-bottom:1px solid var(--line);}
.backlink:hover{border-color:var(--accent);}
a:focus-visible,button:focus-visible{outline:3px solid var(--accent);outline-offset:3px;border-radius:8px;}

header{text-align:center;padding:40px 0 8px;}
.eyebrow{font-size:13px;letter-spacing:.18em;color:var(--accent-deep);font-weight:500;margin-bottom:14px;}
.today-date{font-family:var(--font-head);font-weight:700;font-size:clamp(34px,6vw,52px);letter-spacing:.04em;margin:0;}
.today-sub{margin-top:10px;color:var(--muted);font-size:clamp(16px,2.6vw,19px);}

.section-label{display:flex;align-items:center;gap:16px;margin:44px 0 18px;}
.section-label .label{font-family:var(--font-head);font-weight:700;font-size:22px;white-space:nowrap;letter-spacing:.03em;}
.section-label .line{flex:1;height:1px;background:var(--line);}

.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px 26px;margin-bottom:16px;box-shadow:0 6px 18px rgba(86,96,73,.07);}
.anniv .a-title{font-family:var(--font-head);font-weight:700;font-size:22px;margin:0 0 8px;color:var(--accent-deep);}
.anniv .a-desc{font-size:17px;line-height:1.85;margin:0;}

.quiz .q-text{font-family:var(--font-head);font-weight:700;font-size:20px;margin:0 0 16px;}
.choices{display:flex;flex-direction:column;gap:10px;}
.choice{font-family:var(--font-body);font-size:18px;text-align:left;padding:14px 18px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);cursor:pointer;transition:border-color .15s, background .15s;}
.choice:hover:not(:disabled){border-color:var(--accent);}
.choice:disabled{cursor:default;}
.choice.correct{background:#e7efdc;border-color:var(--accent);color:var(--accent-deep);font-weight:700;}
.choice.wrong{background:#f4e2dd;border-color:#caa99f;color:#8a5a4a;}
.explain{margin-top:14px;padding:14px 16px;background:var(--bg);border-left:3px solid var(--accent);border-radius:0 10px 10px 0;font-size:16px;display:none;}
.explain.show{display:block;}

.q-list{list-style:none;padding:0;margin:0;}
.q-list li{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 20px;margin-bottom:12px;font-size:18px;}

footer{margin:48px 0 60px;padding-top:24px;border-top:1px solid var(--line);text-align:center;color:var(--muted);font-size:14px;}
footer a{color:var(--accent-deep);text-decoration:none;border-bottom:1px solid var(--line);}
</style>
</head>
<body>
<div class="wrap">
  <a class="backlink" href="../">← 素材集にもどる</a>

  <header>
    <div class="eyebrow">あそび・脳トレ素材集</div>
    <h1 class="today-date" id="dateLabel">　</h1>
    <p class="today-sub">今日は何の日？</p>
  </header>

  <main id="main"><p style="text-align:center;color:var(--muted);padding:40px 0;">読み込み中…</p></main>

  <footer>一般社団法人オンラインデイサービス協会<br><a href="https://www.onlinedayservice.com">www.onlinedayservice.com</a></footer>
</div>

<script>
const main=document.getElementById('main');
const dateLabel=document.getElementById('dateLabel');
const d=new Date();
const key=String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');

fetch('./data.json').then(r=>r.json()).then(data=>{
  const day=data[key];
  dateLabel.textContent=(day&&day.date_label)||((d.getMonth()+1)+'月'+d.getDate()+'日');
  if(!day){ main.innerHTML='<p style="text-align:center;color:var(--muted);padding:40px 0;">本日のぶんは準備中です。</p>'; return; }
  let html='';
  html+=section('今日は何の日');
  day.anniversaries.forEach(a=>{ html+='<div class="card anniv"><p class="a-title">'+esc(a.title)+'</p><p class="a-desc">'+esc(a.desc)+'</p></div>'; });
  html+=section('今日のクイズ');
  day.quizzes.forEach((q,qi)=>{
    let ch='';
    q.choices.forEach((c,ci)=>{ ch+='<button class="choice" data-q="'+qi+'" data-c="'+ci+'">'+(ci+1)+'. '+esc(c)+'</button>'; });
    html+='<div class="card quiz"><p class="q-text">Q'+(qi+1)+'.　'+esc(q.q)+'</p><div class="choices">'+ch+'</div><div class="explain" id="ex'+qi+'"></div></div>';
  });
  html+=section('今日の質問');
  html+='<ul class="q-list">'+day.questions.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>';
  main.innerHTML=html;
  day.quizzes.forEach((q,qi)=>{
    const btns=main.querySelectorAll('.choice[data-q="'+qi+'"]');
    btns.forEach(b=>{ b.onclick=()=>{
      btns.forEach(x=>{ x.disabled=true; if(+x.dataset.c===q.answer)x.classList.add('correct'); });
      if(+b.dataset.c!==q.answer)b.classList.add('wrong');
      const ex=document.getElementById('ex'+qi);
      ex.textContent='正解は '+(q.answer+1)+'.　'+q.explain;
      ex.classList.add('show');
    }; });
  });
});

function section(t){return '<div class="section-label"><span class="label">'+t+'</span><span class="line"></span></div>';}
function esc(s){return String(s).replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));}
</script>
</body>
</html>
