<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>四字熟語 穴埋め｜あそび・脳トレ素材集</title>
<meta name="description" content="四字熟語の隠れた一文字を当てる定番脳トレ。読みと意味つき。オンラインデイサービス協会の無料素材集。">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Zen+Old+Mincho:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/tokens.css">

<style>
*{box-sizing:border-box;}
html,body{margin:0;}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);line-height:1.8;-webkit-font-smoothing:antialiased;}
.wrap{max-width:860px;margin:0 auto;padding:0 16px;}
.backlink{display:inline-block;margin:20px 8px 0 0;color:var(--accent-deep);text-decoration:none;font-size:15px;border-bottom:1px solid var(--line);}
.backlink:hover{border-color:var(--accent);}
a:focus-visible,button:focus-visible{outline:3px solid var(--accent);outline-offset:3px;border-radius:8px;}

header{text-align:center;padding:34px 0 6px;}
.eyebrow{font-size:13px;letter-spacing:.18em;color:var(--accent-deep);font-weight:500;margin-bottom:12px;}
h1{font-family:var(--font-head);font-weight:700;font-size:clamp(26px,5vw,38px);letter-spacing:.04em;margin:0 0 10px;}
.lead{color:var(--muted);font-size:15px;margin:0;}

.stage{
  background:var(--card);border:1px solid var(--line);border-radius:18px;
  box-shadow:var(--shadow);text-align:center;
  margin:28px auto 0;max-width:680px;
  padding:clamp(26px,5.5vw,46px) 14px;
}
.q-label{color:var(--muted);font-size:15px;margin:0 0 18px;}
.tiles{display:flex;justify-content:center;gap:clamp(6px,1.8vw,12px);}
.tile{
  width:clamp(64px,18vw,100px);height:clamp(64px,18vw,100px);
  display:flex;align-items:center;justify-content:center;
  font-family:var(--font-head);font-weight:700;
  font-size:clamp(34px,10vw,56px);line-height:1;
  background:var(--bg);border:2px solid var(--line);border-radius:14px;
}
.tile.hidden-tile{border-color:var(--accent);color:var(--accent-deep);background:#edf0e6;}
.tile.hidden-tile.revealed{background:var(--accent);color:#fff;}

.answer{display:none;margin-top:24px;padding-top:20px;border-top:1px dashed var(--line);}
.answer.show{display:block;}
.answer .a-label{font-size:14px;color:var(--muted);letter-spacing:.14em;}
.answer .a-main{font-family:var(--font-head);font-weight:700;font-size:clamp(26px,6vw,40px);color:var(--accent-deep);line-height:1.5;}
.answer .a-yomi{font-size:clamp(16px,4vw,20px);color:var(--ink);}
.answer .a-imi{font-size:clamp(15px,3.6vw,17px);color:var(--ink);margin-top:6px;}

.controls{display:flex;justify-content:center;gap:14px;flex-wrap:wrap;margin:26px 0 8px;}
.btn{
  font-family:var(--font-body);font-weight:700;font-size:19px;cursor:pointer;
  padding:15px 40px;border-radius:999px;border:none;
  background:var(--accent);color:#fff;box-shadow:var(--shadow);
  transition:background .15s, opacity .15s;
}
.btn:hover{background:var(--accent-deep);}
.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line);}
.btn.ghost:hover{border-color:var(--accent);background:var(--card);}

.howto{
  max-width:680px;margin:34px auto 0;background:var(--card);
  border:1px solid var(--line);border-radius:14px;padding:20px 24px;
  font-size:15.5px;
}
.howto b{font-family:var(--font-head);font-size:17px;display:block;margin-bottom:6px;letter-spacing:.04em;}
.howto ul{margin:0;padding-left:1.3em;}
.howto li{margin:4px 0;}

footer{margin:44px 0 56px;padding-top:22px;border-top:1px solid var(--line);text-align:center;color:var(--muted);font-size:13.5px;}
footer a{color:var(--accent-deep);text-decoration:none;border-bottom:1px solid var(--line);}
</style>
</head>
<body>
<div class="wrap">
  <a class="backlink" href="../">← 素材集にもどる</a>

  <header>
    <div class="eyebrow">あそび・脳トレ素材集</div>
    <h1>四字熟語 穴埋め</h1>
    <p class="lead">かくれた一文字を当てましょう。おなじみの四字熟語ばかりです。</p>
  </header>

  <main>
    <div class="stage" aria-live="polite">
      <p class="q-label">？に入る漢字は何でしょう？</p>
      <div class="tiles" id="tiles"></div>
      <div class="answer" id="answer">
        <div class="a-label">こたえ</div>
        <div class="a-main" id="aMain"></div>
        <div class="a-yomi" id="aYomi"></div>
        <div class="a-imi" id="aImi"></div>
      </div>
    </div>

    <div class="controls">
      <button class="btn" id="showBtn">答えを見る</button>
      <button class="btn ghost" id="nextBtn">次の問題</button>
    </div>

    <div class="howto">
      <b>あそびかた</b>
      <ul>
        <li>まず声に出して読んでみると、ひらめきやすくなります。</li>
        <li>答えのあと、「この言葉どおりの経験、ありますか？」と聞くと話が広がります。</li>
        <li>同じ字が二度入る熟語もあるので、油断大敵です。</li>
      </ul>
    </div>
  </main>

  <footer>一般社団法人オンラインデイサービス協会<br><a href="https://www.onlinedayservice.com">www.onlinedayservice.com</a><br><span style="display:inline-block;margin-top:10px;">この素材集は、オンラインデイサービスの現場で使われています。<br>サービスを利用してみたい方は <a href="https://www.onlinedayservice.com/#operators">導入事業者のご紹介</a> へ</span></footer>
</div>

<script>
const tilesEl=document.getElementById('tiles');
const answerEl=document.getElementById('answer');
const aMain=document.getElementById('aMain');
const aYomi=document.getElementById('aYomi');
const aImi=document.getElementById('aImi');
const showBtn=document.getElementById('showBtn');
const nextBtn=document.getElementById('nextBtn');
let ITEMS=[],order=[],pos=-1,current=null;

fetch('./data.json?t='+Date.now()).then(r=>r.json()).then(d=>{
  ITEMS=d.items;
  order=ITEMS.map((_,i)=>i);
  for(let i=order.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]];}
  next();
});

function render(revealed){
  tilesEl.innerHTML='';
  [...current.word].forEach((ch,i)=>{
    const t=document.createElement('div');
    t.className='tile';
    if(i===current.hide){
      t.classList.add('hidden-tile');
      if(revealed){t.classList.add('revealed');t.textContent=ch;}
      else t.textContent='？';
    }else t.textContent=ch;
    tilesEl.appendChild(t);
  });
}
function next(){
  pos=(pos+1)%order.length;
  current=ITEMS[order[pos]];
  render(false);
  aMain.textContent=current.word;
  aYomi.textContent='（'+current.yomi+'）';
  aImi.textContent='意味：'+current.imi;
  answerEl.classList.remove('show');
  showBtn.disabled=false;
}
showBtn.addEventListener('click',()=>{
  if(!current)return;
  render(true);
  answerEl.classList.add('show');
  showBtn.disabled=true;
});
nextBtn.addEventListener('click',()=>{if(ITEMS.length)next();});
</script>
</body>
</html>
