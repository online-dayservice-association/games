<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>思い出の歌｜あそび・脳トレ素材集</title>
<meta name="description" content="なつかしい唱歌・童謡を、歌詞と伴奏つきでみんなで口ずさむ時間。オンラインデイサービス協会の無料素材集。">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Zen+Old+Mincho:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/tokens.css">

<style>
*{box-sizing:border-box;}
html,body{margin:0;}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);line-height:1.8;-webkit-font-smoothing:antialiased;}
.wrap{max-width:860px;margin:0 auto;padding:0 16px;}
.backlink{display:inline-block;margin:20px 8px 0 0;color:var(--accent-deep);text-decoration:none;font-size:15px;border-bottom:1px solid var(--line);background:none;border-top:none;border-left:none;border-right:none;cursor:pointer;font-family:var(--font-body);padding:0 0 1px;}
.backlink:hover{border-color:var(--accent);}
a:focus-visible,button:focus-visible{outline:3px solid var(--accent);outline-offset:3px;border-radius:8px;}

header{text-align:center;padding:34px 0 6px;}
.eyebrow{font-size:13px;letter-spacing:.18em;color:var(--accent-deep);font-weight:500;margin-bottom:12px;}
h1{font-family:var(--font-head);font-weight:700;font-size:clamp(26px,5vw,38px);letter-spacing:.04em;margin:0 0 10px;}
.lead{color:var(--muted);font-size:15px;margin:0;}

/* 曲のいちらん */
.song-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:28px 0 8px;}
@media (max-width:620px){ .song-grid{grid-template-columns:repeat(2,1fr);} }
.song-btn{
  font-family:var(--font-head);font-weight:700;font-size:clamp(17px,3.4vw,21px);
  padding:20px 8px;border:1px solid var(--line);border-radius:14px;
  background:var(--card);color:var(--ink);cursor:pointer;letter-spacing:.04em;
  box-shadow:var(--shadow);
  transition:transform .12s ease, border-color .12s ease;
}
.song-btn:hover{transform:translateY(-2px);border-color:var(--accent);}

/* 歌の画面 */
#songView{display:none;}
.song-card{
  background:var(--card);border:1px solid var(--line);border-radius:18px;
  box-shadow:var(--shadow);margin:24px auto 0;max-width:680px;
  padding:clamp(24px,5vw,42px) clamp(16px,4vw,36px);text-align:center;
}
.song-title{font-family:var(--font-head);font-weight:700;font-size:clamp(28px,6vw,42px);letter-spacing:.06em;margin:0 0 6px;}
.player{margin:18px 0 6px;}
.player iframe{width:100%;max-width:560px;border:0;border-radius:12px;}
.verse{margin:26px 0 0;}
.verse .v-num{font-size:13px;letter-spacing:.18em;color:var(--accent-deep);font-weight:700;margin-bottom:6px;}
.verse .v-text{
  font-family:var(--font-head);font-weight:500;
  font-size:clamp(19px,4.4vw,26px);line-height:2.1;white-space:pre-line;letter-spacing:.04em;
}
.controls{display:flex;justify-content:center;gap:14px;flex-wrap:wrap;margin:26px 0 8px;}
.btn{
  font-family:var(--font-body);font-weight:700;font-size:18px;cursor:pointer;
  padding:14px 36px;border-radius:999px;border:1px solid var(--line);
  background:var(--card);color:var(--ink);box-shadow:var(--shadow);
}
.btn:hover{border-color:var(--accent);}

.note{max-width:680px;margin:30px auto 0;color:var(--muted);font-size:14.5px;text-align:center;}

footer{margin:44px 0 56px;padding-top:22px;border-top:1px solid var(--line);text-align:center;color:var(--muted);font-size:13.5px;}
footer a{color:var(--accent-deep);text-decoration:none;border-bottom:1px solid var(--line);}
</style>
</head>
<body>
<div class="wrap">
  <a class="backlink" href="../">← 素材集にもどる</a>

  <header>
    <div class="eyebrow">あそび・脳トレ素材集</div>
    <h1>思い出の歌</h1>
    <p class="lead">なつかしい唱歌・童謡を、歌詞を見ながらみんなで口ずさみましょう。</p>
  </header>

  <main>
    <div id="gridView">
      <div class="song-grid" id="songGrid"></div>
      <p class="note">曲名を押すと、歌詞と伴奏が出ます。すべて昔から歌いつがれてきた歌（著作権の切れた唱歌・童謡）です。</p>
    </div>

    <div id="songView">
      <div class="song-card">
        <div class="song-title" id="songTitle"></div>
        <div class="player" id="player"></div>
        <div id="verses"></div>
      </div>
      <div class="controls">
        <button class="btn" id="backBtn">← 曲のいちらんへ</button>
      </div>
    </div>
  </main>

  <footer>一般社団法人オンラインデイサービス協会<br><a href="https://www.onlinedayservice.com">www.onlinedayservice.com</a><br><span style="display:inline-block;margin-top:10px;">この素材集は、オンラインデイサービスの現場で使われています。<br>サービスを利用してみたい方は <a href="https://www.onlinedayservice.com/#operators">導入事業者のご紹介</a> へ</span></footer>
</div>

<script>
const gridView=document.getElementById('gridView');
const songView=document.getElementById('songView');
const grid=document.getElementById('songGrid');
const titleEl=document.getElementById('songTitle');
const playerEl=document.getElementById('player');
const versesEl=document.getElementById('verses');
const NUM=['一番','二番','三番','四番'];
let SONGS=[];

fetch('./data.json?t='+Date.now()).then(r=>r.json()).then(d=>{
  SONGS=d.songs;
  SONGS.forEach((s,i)=>{
    const b=document.createElement('button');
    b.className='song-btn';b.textContent=s.title;
    b.onclick=()=>openSong(i);
    grid.appendChild(b);
  });
});

function openSong(i){
  const s=SONGS[i];
  titleEl.textContent=s.title;
  playerEl.innerHTML='';
  if(s.soundcloud){
    const f=document.createElement('iframe');
    f.height=120;f.allow='autoplay';
    f.src=s.soundcloud;
    f.title=s.title+' の伴奏';
    playerEl.appendChild(f);
  }
  versesEl.innerHTML='';
  s.verses.forEach((v,j)=>{
    const d=document.createElement('div');
    d.className='verse';
    const n=document.createElement('div');n.className='v-num';n.textContent=s.verses.length>1?(NUM[j]||(j+1)+'番'):'';
    const t=document.createElement('div');t.className='v-text';t.textContent=v;
    d.appendChild(n);d.appendChild(t);
    versesEl.appendChild(d);
  });
  gridView.style.display='none';
  songView.style.display='block';
  window.scrollTo({top:0});
}
document.getElementById('backBtn').addEventListener('click',()=>{
  playerEl.innerHTML='';
  songView.style.display='none';
  gridView.style.display='block';
});
</script>
</body>
</html>
