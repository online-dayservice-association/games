<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>若者の悩みに答えよう｜あそび・脳トレ素材集</title>

    <!-- フォント（協会ブランドと統一） -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Zen+Old+Mincho:wght@500;700&display=swap" rel="stylesheet">

    <!-- デザイントークン（色・フォントの基準値を共有） -->
    <link rel="stylesheet" href="../assets/tokens.css">

    <style>
        *{box-sizing:border-box;}
        html,body{margin:0;}
        body{
            background:var(--bg);color:var(--ink);
            font-family:var(--font-body);line-height:1.9;
            -webkit-font-smoothing:antialiased;
        }
        h1,h2{margin:0;font-family:var(--font-head);}
        .hidden{display:none !important;}

        /* メニューへ戻る */
        .backlink{
            display:inline-block;margin:20px 0 0 20px;
            color:var(--accent-deep);text-decoration:none;font-size:15px;
            border-bottom:1px solid var(--line);
        }
        .backlink:hover{border-color:var(--accent);}
        a:focus-visible,button:focus-visible{outline:3px solid var(--accent);outline-offset:3px;border-radius:8px;}

        /* レイアウト幅 */
        section{margin:48px auto;padding:0 16px;}
        section:not(#whiteboardSec){max-width:860px;}
        #whiteboardSec{max-width:860px;width:100%;padding:0 16px;}

        /* ヒーロー */
        #hero{padding:48px 16px 8px;text-align:center;background:transparent;}
        #hero h1{font-size:clamp(30px,5vw,46px);font-weight:700;letter-spacing:.04em;line-height:1.3;}
        #hero .sub{margin-top:14px;font-size:clamp(17px,3vw,22px);color:var(--muted);}

        /* セクション見出し（明朝＋罫線） */
        h2{
            font-size:clamp(22px,4vw,28px);margin-bottom:22px;letter-spacing:.03em;
            display:flex;align-items:center;gap:16px;
        }
        h2::after{content:"";flex:1;height:1px;background:var(--line);}

        /* カテゴリボタン */
        #cat-area{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-bottom:6px;}
        #cat-area button{
            padding:10px 20px;font-size:18px;font-family:var(--font-body);
            border:1px solid var(--line);border-radius:999px;
            background:var(--card);color:var(--ink);cursor:pointer;
            transition:border-color .15s ease, background .15s ease, color .15s ease;
        }
        #cat-area button:hover{border-color:var(--accent);}
        #cat-area button.active{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700;}

        /* お題カード（主役・大きく・くっきり） */
        #nayami-card{
            background:var(--card);color:var(--ink);
            padding:44px 38px;border-radius:18px;margin-top:18px;
            font-size:clamp(26px,3.4vw,34px);line-height:1.85;
            min-height:8rem;display:flex;align-items:center;justify-content:center;text-align:center;
            border:1px solid var(--line);
            box-shadow:0 8px 24px rgba(86,96,73,.10);
        }

        /* 次へボタン */
        #next-btn{
            display:block;margin:28px auto 0;
            padding:16px 44px;font-size:22px;font-weight:700;font-family:var(--font-body);
            background:var(--accent);color:#fff;
            border:none;border-radius:999px;cursor:pointer;
            box-shadow:var(--shadow);
            transition:background .18s ease, transform .18s ease;
        }
        #next-btn:hover{background:var(--accent-deep);transform:translateY(-2px);}

        /* ホワイトボード */
        #whiteboardSec{margin-top:72px;}
        #wbHeader{
            display:flex;justify-content:space-between;align-items:center;gap:12px;
            padding:14px 18px;background:var(--card);
            border:1px solid var(--line);border-radius:14px 14px 0 0;
        }
        #wbTitle{font-family:var(--font-head);font-size:22px;font-weight:700;color:var(--ink);}
        #wbControls{display:flex;gap:12px;align-items:center;}
        #wbControls button{
            padding:10px 20px;font-size:17px;font-weight:700;font-family:var(--font-body);
            background:var(--card);color:var(--accent-deep);
            border:1px solid var(--accent);border-radius:999px;cursor:pointer;
            transition:background .15s ease, color .15s ease;
        }
        #wbControls button:hover{background:var(--accent);color:#fff;}
        .wb-color{width:1.5rem;height:1.5rem;border-radius:50%;background:#000;border:2px solid #eee;cursor:pointer;}
        .wb-color.active{border-color:#fff;box-shadow:0 0 0 2px var(--accent);}
        #wbEraser{background:var(--card);border:2px dashed var(--muted);display:flex;align-items:center;justify-content:center;font-size:16px;color:var(--muted);}

        #wbEditor,#wbCanvasWrap{
            width:100%;height:70vh;min-height:480px;background:#fff;
            margin:0 auto;border:1px solid var(--line);border-radius:0 0 14px 14px;border-top:none;
        }
        #wbEditor{padding:18px;font-size:28px;line-height:1.5;border:none;resize:none;outline:none;color:var(--ink);font-family:var(--font-body);}
        #wbCanvasWrap{display:none;}
        #wbCanvas{width:100%;height:100%;touch-action:none;cursor:crosshair;}

        /* モバイル調整 */
        @media(max-width:480px){
            #nayami-card{font-size:23px;padding:30px 22px;}
            #next-btn{font-size:20px;width:100%;}
            #wbEditor{font-size:24px;}
            #wbEditor,#wbCanvasWrap{min-height:400px;}
            #wbHeader{flex-wrap:wrap;}
        }

        /* 1列固定（既存踏襲） */
        #mainArea{display:block;}
    </style>
</head>
<body>
    <a class="backlink" href="../">← 素材集にもどる</a>

    <!-- ▼▼▼ BEGIN main content ▼▼▼ -->
    <section id="hero">
        <h1>若者の悩みに答えよう</h1>
        <p class="sub">あなたの経験が、誰かのヒントになります</p>
    </section>

    <div id="mainArea">
        <section id="cardArea">
            <h2>悩みカード</h2>
            <div id="cat-area" aria-label="カテゴリ選択"></div>
            <div id="nayami-card" role="region" aria-live="polite">読み込み中…</div>
            <button id="next-btn" aria-label="次のお悩みを表示">次のお悩みを表示</button>
        </section>

        <section id="whiteboardSec">
        <header id="wbHeader">
            <div id="wbTitle">ホワイトボード</div>
            <div id="wbControls">
                <button id="wbModeBtn">お絵描きモード</button>
                <button id="wbClearBtn">クリア</button>
                <div id="wbPalette" class="hidden" style="display:none;">
                    <span class="wb-color" data-color="#111827"></span>
                    <span class="wb-color" data-color="#dc2626"></span>
                    <span class="wb-color" data-color="#1d4ed8"></span>
                    <span class="wb-color" data-color="#16a34a"></span>
                    <span class="wb-color" id="wbEraser" title="消しゴム">✕</span>
                </div>
            </div>
        </header>

        <textarea id="wbEditor" placeholder="入力欄"></textarea>
        <div id="wbCanvasWrap"><canvas id="wbCanvas"></canvas></div>
    </section>
    <!-- ▲▲▲ END main content ▲▲▲ -->

    <script>
        /* ---------- 悩みカード設定 ---------- */
        /* データはこのフォルダ内の data.json から読み込む（外部サービス非依存）。
           お題の編集は data.json を直接編集、または Claude に依頼。
           カテゴリはデータから自動生成するので、ここで決め打ちしない。 */
        const DATA_URL="./data.json";

        const catWrap=document.getElementById("cat-area");
        const nayamiCard=document.getElementById("nayami-card");
        const nextBtn=document.getElementById("next-btn");

        let allData=[],curFilter="すべて";

        function refreshButtons(){
            catWrap.querySelectorAll("button").forEach(b=>b.classList.toggle("active",b.textContent===curFilter));
        }

        /* ---------- カテゴリボタン生成（データから自動生成） ---------- */
        function buildCategories(){
            const cats=["すべて",...new Set(allData.map(r=>r["カテゴリ"]).filter(Boolean))];
            catWrap.innerHTML="";
            cats.forEach(cat=>{
                const btn=document.createElement("button");
                btn.textContent=cat;
                btn.onclick=()=>{curFilter=cat;refreshButtons();showRandom();};
                catWrap.appendChild(btn);
            });
            refreshButtons();
        }

        /* ---------- データ取得 → 初期表示 ---------- */
        fetch(DATA_URL)
            .then(r=>r.json())
            .then(json=>{allData=json;buildCategories();showRandom();})
            .catch(()=>showMsg("データを読み込めませんでした"));

        nextBtn.onclick=showRandom;

        function showRandom(){
            if(!allData.length){showMsg("読み込み中…");return;}
            const pool=(curFilter==="すべて")?allData:allData.filter(r=>r["カテゴリ"]===curFilter);
            if(!pool.length){showMsg("このカテゴリにはお題がありません");return;}
            const pick=pool[Math.floor(Math.random()*pool.length)];
            showMsg(pick["悩み本文"]);
        }
        function showMsg(txt){nayamiCard.textContent=txt;}

        /* ---------- ホワイトボード ---------- */
        const wbEditor=document.getElementById("wbEditor");
        const wbCanvasWrap=document.getElementById("wbCanvasWrap");
        const wbCanvas=document.getElementById("wbCanvas");
        const wbCtx=wbCanvas.getContext("2d");
        const wbModeBtn=document.getElementById("wbModeBtn");
        const wbClearBtn=document.getElementById("wbClearBtn");
        const wbPalette=document.getElementById("wbPalette");
        const wbColors=wbPalette.querySelectorAll(".wb-color");

        let wbDrawMode=false,wbDrawing=false,wbColor="#111827",wbErasing=false;

        /* キャンバスリサイズ */
        function wbResize(){wbCanvas.width=wbCanvas.offsetWidth;wbCanvas.height=wbCanvas.offsetHeight;}
        window.addEventListener("resize",wbResize);

        /* モード切替 */
        wbModeBtn.onclick=()=>{
            wbDrawMode=!wbDrawMode;
            if(wbDrawMode){
                wbEditor.classList.add("hidden");wbCanvasWrap.style.display="block";
                // パレットを表示しないように修正
                // wbPalette.classList.remove("hidden");
                wbModeBtn.textContent="テキストモード";wbResize();
            }else{
                wbCanvasWrap.style.display="none";wbEditor.classList.remove("hidden");
                wbPalette.classList.add("hidden");wbModeBtn.textContent="お絵描きモード";
            }
        };

        /* クリア */
        wbClearBtn.onclick=()=>{
            if(wbDrawMode){
                if(confirm("キャンバスを白紙にしますか？")) wbCtx.clearRect(0,0,wbCanvas.width,wbCanvas.height);
            }else{
                if(confirm("メモを完全に消去しますか？")){wbEditor.value="";wbEditor.focus();}
            }
        };

        /* パレット */
        wbColors.forEach(btn=>{
            btn.onclick=()=>{
                wbErasing=btn.id==="wbEraser";
                wbColors.forEach(b=>b.classList.remove("active"));
                btn.classList.add("active");
                wbColor=btn.dataset.color||"#ffffff";
                wbCtx.globalCompositeOperation=wbErasing?"destination-out":"source-over";
            };
        });
        wbColors[0].classList.add("active");

        /* 描画 */
        wbCanvas.addEventListener("pointerdown",e=>{
            wbDrawing=true;wbCtx.beginPath();wbCtx.moveTo(e.offsetX,e.offsetY);
        });
        wbCanvas.addEventListener("pointermove",e=>{
            if(!wbDrawing) return;
            wbCtx.lineWidth=wbErasing?30:6;wbCtx.lineCap="round";wbCtx.strokeStyle=wbColor;
            wbCtx.lineTo(e.offsetX,e.offsetY);wbCtx.stroke();
        });
        ["pointerup","pointerleave","pointercancel"].forEach(evt=>wbCanvas.addEventListener(evt,()=>wbDrawing=false));
    </script>
</body>
</html>
