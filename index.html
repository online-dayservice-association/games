<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>あそび・脳トレ素材集｜一般社団法人オンラインデイサービス協会</title>
<meta name="description" content="オンラインデイサービスの時間に、画面共有で一緒に楽しめるあそび・脳トレの素材集。点数や記憶力を競うものではなく、会話とつながりのきっかけとして、どなたでも無料でお使いいただけます。">

<!-- OGP -->
<meta property="og:type" content="website">
<meta property="og:title" content="あそび・脳トレ素材集｜オンラインデイサービス協会">
<meta property="og:description" content="画面共有で一緒に楽しめる、あそび・脳トレの素材集。会話とつながりのきっかけに。">
<meta property="og:url" content="https://game.onlinedayservice.com/">
<meta name="twitter:card" content="summary">

<!-- フォント -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Zen+Old+Mincho:wght@500;700&display=swap" rel="stylesheet">

<!-- スタイル（見た目はここから。順番：基準値 → 土台 → ページ固有） -->
<link rel="stylesheet" href="assets/tokens.css">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/menu.css">
</head>
<body>
<div class="wrap">

  <header>
    <div class="eyebrow">一般社団法人オンラインデイサービス協会</div>
    <h1>あそび・脳トレ素材集</h1>
    <p class="lead">画面を見ながら、みんなで一緒に。<br>会話とつながりのきっかけになる素材を集めました。</p>
  </header>

  <main>

    <!-- 素材の一覧は games.json から読み込みます。素材を足すときは games.json に1行足すだけ。 -->
    <div id="menu" aria-live="polite"></div>
    <noscript><p class="note">一覧を表示するには、ブラウザのJavaScriptを有効にしてください。</p></noscript>

    <p class="note">すべて無料で、パソコン・スマートフォン・タブレットのブラウザからお使いいただけます。アプリのインストールは要りません。新しい素材も、これから少しずつ増えていきます。</p>

  </main>

  <footer>
    一般社団法人オンラインデイサービス協会<br>
    <a href="https://www.onlinedayservice.com">www.onlinedayservice.com</a><br><span style="display:inline-block;margin-top:10px;">この素材集は、オンラインデイサービスの現場で使われています。<br>サービスを利用してみたい方は <a href="https://www.onlinedayservice.com/#operators">導入事業者のご紹介</a> へ</span>
  </footer>

</div>
<script>
(function(){
  var menu = document.getElementById('menu');
  function el(tag, cls, text){
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }
  fetch('./games.json', {cache:'no-cache'})
    .then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); })
    .then(function(data){
      data.sections.forEach(function(sec){
        var section = el('section');
        var label = el('div','section-label');
        label.appendChild(el('span','label',sec.label));
        label.appendChild(el('span','line'));
        label.appendChild(el('span','count',String(sec.items.length)));
        section.appendChild(label);
        var grid = el('div');
        grid.style.cssText = 'display:grid;gap:16px;';
        sec.items.forEach(function(it){
          var a = el('a','card feature');
          a.href = './' + it.id + '/';
          var body = el('div','feature-body');
          body.appendChild(el('span','badge-live','公開中'));
          body.appendChild(el('div','name',it.name));
          body.appendChild(el('div','desc',it.desc));
          a.appendChild(body);
          a.appendChild(el('span','btn','ひらく'));
          grid.appendChild(a);
        });
        section.appendChild(grid);
        menu.appendChild(section);
      });
    })
    .catch(function(){
      menu.appendChild(el('p','note','一覧を読み込めませんでした。お手数ですが、ページを読み込み直してください。'));
    });
})();
</script>
</body>
</html>
