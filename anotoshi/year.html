<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>あの日あの年｜あそび・脳トレ素材集</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Zen+Old+Mincho:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/tokens.css">

<style>
*{box-sizing:border-box;}
html,body{margin:0;}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);line-height:1.9;-webkit-font-smoothing:antialiased;}
.wrap{max-width:860px;margin:0 auto;padding:0 16px;}
.backlink{display:inline-block;margin:20px 14px 0 0;color:var(--accent-deep);text-decoration:none;font-size:15px;border-bottom:1px solid var(--line);}
.backlink:hover{border-color:var(--accent);}
a:focus-visible,button:focus-visible{outline:3px solid var(--accent);outline-offset:3px;border-radius:8px;}

header{text-align:center;padding:36px 0 4px;}
.eyebrow{font-size:13px;letter-spacing:.18em;color:var(--accent-deep);font-weight:500;margin-bottom:10px;}
.year-icon{margin:0 auto 6px;width:84px;height:84px;}
h1{font-family:var(--font-head);font-weight:700;font-size:clamp(38px,8vw,58px);letter-spacing:.04em;margin:0;line-height:1.2;}
h1 .unit{font-size:.45em;color:var(--muted);}
.wareki{font-size:clamp(18px,3.6vw,24px);color:var(--accent-deep);font-weight:700;margin:4px 0 0;}

.section-label{display:flex;align-items:center;gap:16px;margin:40px 0 14px;}
.section-label .label{font-family:var(--font-head);font-weight:700;font-size:21px;white-space:nowrap;letter-spacing:.04em;}
.section-label .line{flex:1;height:1px;background:var(--line);}

.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 22px;margin-bottom:10px;box-shadow:0 4px 14px rgba(86,96,73,.05);}
.card ul{margin:0;padding:0;list-style:none;}
.card li{font-size:17px;padding:7px 0;}
.card li+li{border-top:1px dashed var(--line);}

table.bukka{width:100%;border-collapse:collapse;font-size:17px;}
table.bukka td{padding:9px 4px;}
table.bukka tr+tr td{border-top:1px dashed var(--line);}
table.bukka td.price{text-align:right;font-weight:700;color:var(--accent-deep);white-space:nowrap;}

.qbox li{color:var(--ink);}

/* 年ナビ */
.daynav{margin:46px 0 0;}
.daynav-row{display:flex;justify-content:center;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px;}
.navbtn{
  display:inline-flex;align-items:center;justify-content:center;gap:.4em;
  padding:14px 22px;border-radius:999px;
  background:var(--card);border:1px solid var(--accent);color:var(--accent-deep);
  font-family:var(--font-body);font-weight:700;font-size:17px;text-decoration:none;
  transition:background .15s ease,color .15s ease,transform .12s ease;
}
.navbtn:hover{background:var(--accent);color:#fff;transform:translateY(-2px);}
.navbtn.primary{background:var(--accent);color:#fff;box-shadow:var(--shadow);}
.navbtn.primary:hover{background:var(--accent-deep);}
.navbtn.sub{border-color:var(--line);color:var(--muted);font-weight:500;font-size:15px;padding:11px 20px;}
.navbtn.sub:hover{background:var(--bg);color:var(--accent-deep);border-color:var(--accent);transform:none;}
.navbtn.off{opacity:.4;pointer-events:none;}
@media (max-width:560px){ .navbtn{font-size:15px;padding:12px 16px;} }

footer{margin:48px 0 60px;padding-top:24px;border-top:1px solid var(--line);text-align:center;color:var(--muted);font-size:13.5px;}
footer a{color:var(--accent-deep);text-decoration:none;border-bottom:1px solid var(--line);}
</style>
</head>
<body>
<div class="wrap">
  <a class="backlink" href="./">← あの日あの年トップへ</a>
  <a class="backlink" href="../">素材集トップへ</a>

  <header>
    <div class="eyebrow">あの日あの年</div>
    <div class="year-icon" id="yIcon"></div>
    <h1><span id="yYear">----</span><span class="unit">年</span></h1>
    <p class="wareki" id="yWareki">　</p>
  </header>

  <main id="main"><p style="text-align:center;color:var(--muted);padding:40px 0;">読み込み中…</p></main>

  <nav class="daynav" aria-label="年の移動">
    <div class="daynav-row">
      <a class="navbtn" id="prevBtn" href="#">←</a>
      <a class="navbtn primary" href="./">あの日あの年トップへ</a>
      <a class="navbtn" id="nextBtn" href="#">→</a>
    </div>
    <div class="daynav-row">
      <a class="navbtn sub" href="../">素材集トップへ</a>
    </div>
  </nav>

  <div class="to-menu" style="text-align:center;margin:38px 0 -6px;"><a href="../" style="display:inline-block;font-family:var(--font-body);font-weight:700;font-size:17px;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:999px;padding:13px 40px;text-decoration:none;box-shadow:var(--shadow);">← 素材集にもどる</a></div>
<footer>一般社団法人オンラインデイサービス協会<br><a href="https://www.onlinedayservice.com">www.onlinedayservice.com</a><br><span style="display:inline-block;margin-top:10px;">この素材集は、オンラインデイサービスの現場で使われています。<br>サービスを利用してみたい方は <a href="https://www.onlinedayservice.com/#operators">導入事業者のご紹介</a> へ</span></footer>
</div>

<script>
function wareki(y){
  if(y===1926) return "大正15年・昭和元年";
  if(y<1989) return "昭和"+(y-1925)+"年";
  if(y===1989) return "昭和64年・平成元年";
  return "平成"+(y-1988)+"年";
}

 phone:'<svg viewBox="0 0 84 84" fill="none"><rect x="22" y="14" width="40" height="56" rx="8" fill="#fffdf8" stroke="#566049" stroke-width="3"/><circle cx="42" cy="44" r="14" fill="#edf0e6" stroke="#566049" stroke-width="2.5"/><circle cx="42" cy="44" r="4" fill="#566049"/><rect x="34" y="20" width="16" height="5" rx="2.5" fill="#566049"/></svg>',

 note:'<svg viewBox="0 0 84 84" fill="none"><circle cx="28" cy="60" r="9" fill="#6f7d5e"/><circle cx="58" cy="52" r="9" fill="#6f7d5e"/><path d="M37 60 V22 L67 16 V52" stroke="#566049" stroke-width="4" fill="none" stroke-linejoin="round"/><path d="M37 30 L67 24" stroke="#566049" stroke-width="4"/></svg>',
 dog:'<svg viewBox="0 0 84 84" fill="none"><ellipse cx="42" cy="56" rx="20" ry="14" fill="#fffdf8" stroke="#566049" stroke-width="3"/><circle cx="42" cy="32" r="14" fill="#fffdf8" stroke="#566049" stroke-width="3"/><path d="M30 24 Q24 14 30 12 Q36 14 36 20 Z" fill="#edf0e6" stroke="#566049" stroke-width="2.5" stroke-linejoin="round"/><path d="M54 24 Q60 14 54 12 Q48 14 48 20 Z" fill="#edf0e6" stroke="#566049" stroke-width="2.5" stroke-linejoin="round"/><circle cx="37" cy="31" r="2.5" fill="#566049"/><circle cx="47" cy="31" r="2.5" fill="#566049"/><ellipse cx="42" cy="38" rx="3.5" ry="2.5" fill="#566049"/><path d="M62 50 Q72 44 70 54" stroke="#566049" stroke-width="3" fill="none" stroke-linecap="round"/></svg>',
 ball:'<svg viewBox="0 0 84 84" fill="none"><circle cx="42" cy="42" r="26" fill="#fffdf8" stroke="#566049" stroke-width="3"/><path d="M24 24 Q32 36 30 52 Q28 60 22 62" stroke="#b9543f" stroke-width="2.5" fill="none"/><path d="M60 24 Q52 36 54 52 Q56 60 62 62" stroke="#b9543f" stroke-width="2.5" fill="none"/><path d="M27 27 Q42 34 57 27" stroke="#b9543f" stroke-width="2" fill="none"/><path d="M25 56 Q42 50 59 56" stroke="#b9543f" stroke-width="2" fill="none"/></svg>',
 cup:'<svg viewBox="0 0 84 84" fill="none"><path d="M26 28 H58 L54 66 Q53 70 48 70 H36 Q31 70 30 66 Z" fill="#fffdf8" stroke="#566049" stroke-width="3" stroke-linejoin="round"/><ellipse cx="42" cy="28" rx="16" ry="5" fill="#edf0e6" stroke="#566049" stroke-width="3"/><path d="M34 16 Q36 20 34 24 M42 14 Q44 18 42 22 M50 16 Q52 20 50 24" stroke="#b9543f" stroke-width="2.5" stroke-linecap="round"/><line x1="28" y1="42" x2="56" y2="42" stroke="#b9543f" stroke-width="2.5"/></svg>',
 game:'<svg viewBox="0 0 84 84" fill="none"><rect x="12" y="28" width="60" height="30" rx="14" fill="#fffdf8" stroke="#566049" stroke-width="3"/><line x1="26" y1="37" x2="26" y2="49" stroke="#566049" stroke-width="4" stroke-linecap="round"/><line x1="20" y1="43" x2="32" y2="43" stroke="#566049" stroke-width="4" stroke-linecap="round"/><circle cx="56" cy="38" r="3.5" fill="#b9543f"/><circle cx="64" cy="46" r="3.5" fill="#6f7d5e"/></svg>',

 flower:'<svg viewBox="0 0 84 84" fill="none"><circle cx="42" cy="26" r="9" fill="#f3c9d4" stroke="#b9543f" stroke-width="2.5"/><circle cx="58" cy="38" r="9" fill="#f3c9d4" stroke="#b9543f" stroke-width="2.5"/><circle cx="52" cy="56" r="9" fill="#f3c9d4" stroke="#b9543f" stroke-width="2.5"/><circle cx="32" cy="56" r="9" fill="#f3c9d4" stroke="#b9543f" stroke-width="2.5"/><circle cx="26" cy="38" r="9" fill="#f3c9d4" stroke="#b9543f" stroke-width="2.5"/><circle cx="42" cy="43" r="8" fill="#f3c98b" stroke="#b08a3e" stroke-width="2.5"/></svg>'
};
const SECTIONS=[
  ["events","世の中の出来事"],
  ["kurashi","くらし・流行"],
  ["sports","スポーツ"],
  ["geino","芸能・歌"],
  ["bukka","ものの値段"],
  ["questions","お話のきっかけ"]
];

const y=parseInt(new URLSearchParams(location.search).get('y'),10);
const main=document.getElementById('main');

fetch('./data.json?t='+Date.now()).then(r=>r.json()).then(D=>{
  const avail=Object.keys(D).map(Number).sort((a,b)=>a-b);
  if(!D[y]){
    document.getElementById('yYear').textContent=y||'----';
    document.getElementById('yWareki').textContent=y?wareki(y):'';
    main.innerHTML='<p style="text-align:center;color:var(--muted);padding:40px 0;">この年はただいま準備中です。<br>ルーレットにもどって、別の年へ旅してみてください。</p>';
    document.getElementById('prevBtn').classList.add('off');
    document.getElementById('nextBtn').classList.add('off');
    return;
  }
  const data=D[y];
  document.getElementById('yYear').textContent=y;
  document.getElementById('yWareki').textContent=data.wareki||wareki(y);
  if(data.icon&&ICONS[data.icon]) document.getElementById('yIcon').innerHTML=ICONS[data.icon];

  let html='';
  SECTIONS.forEach(([k,label])=>{
    const v=data[k];
    if(!v||!v.length) return;
    html+='<div class="section-label"><span class="label">'+label+'</span><span class="line"></span></div>';
    if(k==='bukka'){
      html+='<div class="card"><table class="bukka">'+v.map(b=>'<tr><td>'+esc(b.item)+'</td><td class="price">'+esc(b.price)+'</td></tr>').join('')+'</table></div>';
    }else{
      html+='<div class="card'+(k==='questions'?' qbox':'')+'"><ul>'+v.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul></div>';
    }
  });
  main.innerHTML=html;

  // 前後の年（データのある年の中で移動）
  const i=avail.indexOf(y);
  const pb=document.getElementById('prevBtn'), nb=document.getElementById('nextBtn');
  if(i>0){ pb.href='./year.html?y='+avail[i-1]; pb.textContent='← '+avail[i-1]+'年'; }
  else pb.classList.add('off'), pb.textContent='←';
  if(i<avail.length-1){ nb.href='./year.html?y='+avail[i+1]; nb.textContent=avail[i+1]+'年 →'; }
  else nb.classList.add('off'), nb.textContent='→';
});
function esc(s){return String(s).replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));}
</script>
</body>
</html>
