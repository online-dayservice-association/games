<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>思い出の歌（うた）｜あそび・脳トレ素材集</title>
<meta name="robots" content="noindex">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Zen+Old+Mincho:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/tokens.css">

<style>
*{box-sizing:border-box;}
html,body{margin:0;}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);line-height:1.8;-webkit-font-smoothing:antialiased;}
.wrap{max-width:860px;margin:0 auto;padding:0 16px;}
.backlink{display:inline-block;margin:20px 8px 0 0;color:var(--accent-deep);text-decoration:none;font-size:15px;border-bottom:1px solid var(--line);}
.backlink:hover{border-color:var(--accent);}
a:focus-visible,button:focus-visible{outline:3px solid var(--accent);outline-offset:3px;border-radius:8px;}
header{text-align:center;padding:34px 0 6px;}
.eyebrow{font-size:13px;letter-spacing:.18em;color:var(--accent-deep);font-weight:500;margin-bottom:12px;}
h1{font-family:var(--font-head);font-weight:700;font-size:clamp(26px,5vw,38px);letter-spacing:.04em;margin:0 0 10px;}
.lead{color:var(--muted);font-size:15px;margin:0;}

.sorts{display:flex;justify-content:center;gap:8px;margin:20px 0 0;}
.sort-btn{
  font-family:var(--font-body);font-size:15px;font-weight:700;cursor:pointer;
  padding:9px 22px;border-radius:999px;border:1px solid var(--line);
  background:var(--card);color:var(--ink);
}
.sort-btn:hover{border-color:var(--accent);}
.sort-btn.active{background:var(--accent);border-color:var(--accent);color:#fff;}

.songs{display:flex;flex-direction:column;gap:10px;margin:22px 0 0;}
.song{
  display:flex;align-items:center;gap:14px;
  background:var(--card);border:1px solid var(--line);border-radius:14px;
  padding:14px 18px;text-decoration:none;color:inherit;
  transition:transform .12s ease,border-color .12s ease,box-shadow .12s ease;
}
.song:hover{transform:translateY(-2px);border-color:var(--accent);box-shadow:var(--shadow);}
.song .name{font-family:var(--font-head);font-weight:700;font-size:clamp(19px,4.4vw,24px);flex:1;}
.song .tags{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;}
.song .tag{font-size:12.5px;font-weight:700;color:var(--accent-deep);background:#edf0e6;border-radius:999px;padding:2px 12px;white-space:nowrap;}
footer{margin:44px 0 56px;padding-top:22px;border-top:1px solid var(--line);text-align:center;color:var(--muted);font-size:13.5px;}
</style>
</head>
<body>
<div class="wrap">
  <a class="backlink" href="../">← 素材集にもどる</a>

  <header>
    <div class="eyebrow">あそび・脳トレ素材集（おためし・メニュー未掲載）</div>
    <h1>思い出の歌</h1>
    <p class="lead">なつかしい唱歌・童謡を、ピアノの伴奏でみんなで歌いましょう。曲はこれから増えていきます。</p>
  </header>

  <main>
    <div class="sorts">
      <button class="sort-btn active" data-mode="yomi">50音順</button>
      <button class="sort-btn" data-mode="season">季節順</button>
    </div>
    <div class="songs" id="songs"></div>
  </main>

  <footer>歌声: VOICEVOX　／　伴奏: GeneralUser GS<br>一般社団法人オンラインデイサービス協会</footer>
</div>

<script>
const songsEl=document.getElementById('songs');
let DATA=[],mode='yomi';
const SEASON_ORDER={'春':1,'夏':2,'秋':3,'冬':4,'通年':5};

fetch('./data.json?t='+Date.now()).then(r=>r.json()).then(d=>{DATA=d.songs;render();});

document.querySelectorAll('.sort-btn').forEach(b=>{
  b.onclick=()=>{
    mode=b.dataset.mode;
    document.querySelectorAll('.sort-btn').forEach(x=>x.classList.toggle('active',x===b));
    render();
  };
});

function render(){
  const list=[...DATA];
  if(mode==='yomi') list.sort((a,b)=>a.yomi.localeCompare(b.yomi,'ja'));
  else list.sort((a,b)=>(SEASON_ORDER[a.season]-SEASON_ORDER[b.season])||((a.months[0]||13)-(b.months[0]||13))||a.yomi.localeCompare(b.yomi,'ja'));
  songsEl.innerHTML='';
  for(const s of list){
    const a=document.createElement('a');
    a.className='song';a.href='./song.html?id='+s.id;
    const tags=[s.meter+'拍子',s.season+(s.months.length?'（'+s.months.join('・')+'月）':'')];
    a.innerHTML='<span class="name"></span><span class="tags">'+tags.map(t=>'<span class="tag">'+t+'</span>').join('')+'</span>';
    a.querySelector('.name').textContent=s.title;
    songsEl.appendChild(a);
  }
}
</script>
</body>
</html>
