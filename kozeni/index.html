<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>小銭計算｜あそび・脳トレ素材集</title>
<meta name="description" content="ならんだ小銭の合計を当てる、暮らしに役立つ計算あそび。オンラインデイサービス協会の無料素材集。">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Zen+Old+Mincho:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/tokens.css">

<style>
*{box-sizing:border-box;}
html,body{margin:0;}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);line-height:1.8;-webkit-font-smoothing:antialiased;}
.wrap{max-width:860px;margin:0 auto;padding:0 16px;}
.backlink{display:inline-block;margin:20px 8px 0 0;color:var(--accent-deep);text-decoration:none;font-size:15px;border-bottom:1px solid var(--line);}
.backlink:hover{border-color:var(--accent);}
a:focus-visible,button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:3px;border-radius:8px;}

header{text-align:center;padding:34px 0 6px;}
.eyebrow{font-size:13px;letter-spacing:.18em;color:var(--accent-deep);font-weight:500;margin-bottom:12px;}
h1{font-family:var(--font-head);font-weight:700;font-size:clamp(26px,5vw,38px);letter-spacing:.04em;margin:0 0 10px;}
.lead{color:var(--muted);font-size:15px;margin:0;}

.stage{
  background:var(--card);border:1px solid var(--line);border-radius:18px;
  box-shadow:var(--shadow);text-align:center;
  margin:28px auto 0;max-width:680px;
  padding:clamp(24px,5vw,40px) 14px;
}
.q-label{color:var(--muted);font-size:15px;margin:0 0 16px;}

.coin-row{display:flex;justify-content:center;gap:clamp(8px,2vw,16px);margin:10px 0;flex-wrap:wrap;}
.coin{
  width:clamp(58px,14vw,84px);height:clamp(58px,14vw,84px);
  border-radius:50%;position:relative;
  display:flex;align-items:center;justify-content:center;
  font-family:var(--font-head);font-weight:700;
  font-size:clamp(17px,4vw,24px);
  box-shadow:inset 0 0 0 3px rgba(255,255,255,.45), 0 2px 4px rgba(0,0,0,.18);
  border:1px solid rgba(0,0,0,.15);
}
.coin span{position:relative;z-index:1;}
.coin small{font-size:.55em;font-weight:700;}
.yen-1{background:#dde0e4;color:#5a6068;}
.yen-5{background:#cfa94f;color:#6b5418;}
.yen-10{background:#b07a4a;color:#5e3c1d;}
.yen-50{background:#c8ccd2;color:#555c66;}
.yen-100{background:#c8ccd2;color:#555c66;}
.yen-500{background:#c9b37c;color:#665626;}
/* 5円・50円の穴 */
.yen-5::after,.yen-50::after{
  content:"";position:absolute;width:22%;height:22%;border-radius:50%;
  background:var(--card);box-shadow:inset 0 1px 2px rgba(0,0,0,.25);
  top:14%;left:50%;transform:translateX(-50%);
}

.answer-line{display:flex;justify-content:center;align-items:center;gap:10px;margin:22px 0 4px;flex-wrap:wrap;}
.answer-line label{font-size:16px;font-weight:700;}
#answerInput{
  font-family:var(--font-head);font-weight:700;font-size:26px;text-align:center;
  width:150px;padding:10px 8px;border:2px solid var(--line);border-radius:12px;
  background:var(--bg);color:var(--ink);
}
#answerInput:focus{border-color:var(--accent);outline:none;}
.unit{font-size:18px;font-weight:700;}

.msg{min-height:1.8em;font-size:18px;font-weight:700;margin:10px 0 0;}
.msg.good{color:var(--accent-deep);}
.msg.bad{color:#a05a2c;}
.hint-box{display:none;margin-top:10px;color:var(--muted);font-size:16px;}
.hint-box.show{display:block;}

.controls{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin:24px 0 8px;}
.btn{
  font-family:var(--font-body);font-weight:700;font-size:18px;cursor:pointer;
  padding:14px 30px;border-radius:999px;border:none;
  background:var(--accent);color:#fff;box-shadow:var(--shadow);
  transition:background .15s, opacity .15s;
}
.btn:hover{background:var(--accent-deep);}
.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line);}
.btn.ghost:hover{border-color:var(--accent);background:var(--card);}

.howto{
  max-width:680px;margin:34px auto 0;background:var(--card);
  border:1px solid var(--line);border-radius:14px;padding:20px 24px;
  font-size:15.5px;
}
.howto b{font-family:var(--font-head);font-size:17px;display:block;margin-bottom:6px;letter-spacing:.04em;}
.howto ul{margin:0;padding-left:1.3em;}
.howto li{margin:4px 0;}

footer{margin:44px 0 56px;padding-top:22px;border-top:1px solid var(--line);text-align:center;color:var(--muted);font-size:13.5px;}
footer a{color:var(--accent-deep);text-decoration:none;border-bottom:1px solid var(--line);}
</style>
</head>
<body>
<div class="wrap">
  <a class="backlink" href="../">← 素材集にもどる</a>

  <header>
    <div class="eyebrow">あそび・脳トレ素材集</div>
    <h1>小銭計算</h1>
    <p class="lead">ならんだ小銭、ぜんぶでいくら？　お買いものの感覚で計算しましょう。</p>
  </header>

  <main>
    <div class="stage" aria-live="polite">
      <p class="q-label" id="qNumber">問 1</p>
      <div id="coinArea"></div>

      <div class="answer-line">
        <label for="answerInput">合計</label>
        <input id="answerInput" type="number" inputmode="numeric" min="0" max="3000">
        <span class="unit">円</span>
      </div>
      <p class="msg" id="msg"></p>
      <p class="hint-box" id="hintBox"></p>
    </div>

    <div class="controls">
      <button class="btn" id="checkBtn">答え合わせ</button>
      <button class="btn ghost" id="hintBtn">内訳ヒント</button>
      <button class="btn ghost" id="showBtn">答えを見る</button>
      <button class="btn ghost" id="nextBtn">次の問題</button>
    </div>

    <div class="howto">
      <b>あそびかた</b>
      <ul>
        <li>大きい硬貨から数えるのがコツ。「500、600、650……」と声に出してどうぞ。</li>
        <li>むずかしいときは「内訳ヒント」で枚数を確認できます。</li>
        <li>数字を入れて「答え合わせ」。画面共有なら、答えだけ口頭で集めても楽しめます。</li>
      </ul>
    </div>
  </main>

  <footer>一般社団法人オンラインデイサービス協会<br><a href="https://www.onlinedayservice.com">www.onlinedayservice.com</a><br><span style="display:inline-block;margin-top:10px;">この素材集は、オンラインデイサービスの現場で使われています。<br>サービスを利用してみたい方は <a href="https://www.onlinedayservice.com/#operators">導入事業者のご紹介</a> へ</span></footer>
</div>

<script>
const COINS=[1,5,10,50,100,500];
const coinArea=document.getElementById('coinArea');
const msg=document.getElementById('msg');
const hintBox=document.getElementById('hintBox');
const input=document.getElementById('answerInput');
let q=1,answer=0,bag={};

function rand(min,max){return Math.floor(Math.random()*(max-min+1))+min;}

function newQuestion(){
  let picked=[],attempts=0;
  do{
    const n=rand(5,7);
    picked=[];
    for(let i=0;i<n;i++)picked.push(COINS[rand(0,COINS.length-1)]);
    answer=picked.reduce((a,b)=>a+b,0);
    attempts++;
  }while(answer>1000&&attempts<100);
  if(answer>1000){picked=[100,50,10,10,5];answer=175;}
  bag=picked.reduce((acc,v)=>{acc[v]=(acc[v]||0)+1;return acc;},{});

  picked.sort(()=>Math.random()-0.5);
  const mid=Math.ceil(picked.length/2);
  coinArea.innerHTML='';
  for(const row of [picked.slice(0,mid),picked.slice(mid)]){
    const div=document.createElement('div');
    div.className='coin-row';
    for(const v of row){
      const c=document.createElement('div');
      c.className='coin yen-'+v;
      c.setAttribute('aria-label',v+'円玉');
      c.innerHTML='<span>'+v+'<small>円</small></span>';
      div.appendChild(c);
    }
    coinArea.appendChild(div);
  }
  document.getElementById('qNumber').textContent='問 '+q;
  input.value='';
  msg.textContent='';msg.className='msg';
  hintBox.classList.remove('show');
}

function showHint(){
  const order=[500,100,50,10,5,1];
  const parts=order.filter(v=>bag[v]).map(v=>v+'円玉 × '+bag[v]+'枚');
  hintBox.textContent='内訳: '+parts.join('　');
  hintBox.classList.add('show');
}

document.getElementById('checkBtn').addEventListener('click',()=>{
  const val=Number(input.value);
  if(input.value===''||isNaN(val)){msg.textContent='数字を入れてください。';msg.className='msg';return;}
  if(val===answer){msg.textContent='正解！ '+answer+'円でした。';msg.className='msg good';}
  else{msg.textContent='おしい！ もう一度数えてみましょう。';msg.className='msg bad';}
});
document.getElementById('hintBtn').addEventListener('click',showHint);
document.getElementById('showBtn').addEventListener('click',()=>{
  input.value=answer;
  msg.textContent='正解は '+answer+'円です。';msg.className='msg good';
  showHint();
});
document.getElementById('nextBtn').addEventListener('click',()=>{q++;newQuestion();});
input.addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('checkBtn').click();});

newQuestion();
</script>
</body>
</html>
